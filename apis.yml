name: Ezra
description: Ezra (Ezra AI, Inc.) is a preventive-health company offering full-body
  MRI and CT cancer-screening scans directly to consumers. Its screening service scans
  up to 13 organs in as little as 22 minutes to detect early signs of cancer and hundreds
  of other conditions without harmful radiation, with plans spanning a full-body MRI,
  MRI with spine, a comprehensive skeletal/neurological MRI, and heart and lung CT
  scans, plus couples pricing and locations across the United States. Ezra was surfaced
  as a portfolio company of Seedcamp; this profile is a consumer healthcare company
  with no public developer API, and was enriched via the API Evangelist pipeline against
  its public web surface.
